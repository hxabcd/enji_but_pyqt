[project]
name = "enji-but-pyqt"
version = "0.1.1"
description = "一个使用PySide6仿照《胭脂》制作的动画程序"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyside6>=6.11.0",
    "windows11toast>=1.2.6",
]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[dependency-groups]
dev = [
    "pyinstaller>=6.19.0",
]
